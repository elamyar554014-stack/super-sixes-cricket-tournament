<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | SUPER SIXES</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#04140f,#06261c);
color:white;
min-height:100vh;
}

/* HEADER */

header{
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:gold;
letter-spacing:1px;
}

/* LOGIN */

#login{
width:100%;
max-width:400px;
margin:100px auto;
background:rgba(255,255,255,0.06);
padding:35px;
border-radius:18px;
text-align:center;
backdrop-filter:blur(10px);
border:1px solid rgba(255,215,0,0.2);
}

#login h2{
margin-bottom:25px;
color:gold;
}

input{
width:100%;
padding:13px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

button{
padding:12px 20px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffd700;
transform:scale(1.04);
}

#msg{
margin-top:15px;
color:red;
font-weight:bold;
}

/* PANEL */

.container{
width:92%;
max-width:1200px;
margin:auto;
padding:30px 0;
}

.hidden{
display:none;
}

/* GRID */

#teams{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
margin-top:30px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
border:1px solid rgba(255,215,0,0.15);
padding:22px;
border-radius:18px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* TEAM TITLE */

.card h3{
color:gold;
margin-bottom:15px;
font-size:25px;
}

/* LABEL */

label{
display:block;
margin-top:10px;
margin-bottom:5px;
font-size:14px;
color:#ddd;
}

/* PLAYERS */

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:8px;
margin-top:12px;
}

/* PLAYER INPUT */

.players input{
margin:0;
}

/* BUTTON GROUP */

.btn-group{
display:flex;
gap:10px;
margin-top:15px;
}

.btn-group button{
flex:1;
}

/* SAVE */

.save-btn{
background:#00c853;
color:white;
}

/* DELETE */

.delete-btn{
background:#ff1744;
color:white;
}

/* RESPONSIVE */

@media(max-width:600px){

header{
font-size:22px;
}

#login{
width:92%;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<header>
🔐 SUPER SIXES ADMIN PANEL
</header>

<!-- LOGIN -->

<div id="login">

<h2>Admin Login</h2>

<input
type="password"
id="password"
placeholder="Enter Admin Password">

<button onclick="login()">
Login
</button>

<p id="msg"></p>

</div>

<!-- ADMIN PANEL -->

<div class="container hidden" id="adminPanel">

<h2 style="text-align:center;color:gold;">
🏏 Registered Teams
</h2>

<div id="teams"></div>

</div>

<script>

/* LOGIN FUNCTION */

function login(){

let pass = document.getElementById("password").value

if(pass === "samikhan782"){

document.getElementById("login")
.classList.add("hidden")

document.getElementById("adminPanel")
.classList.remove("hidden")

loadTeams()

}else{

document.getElementById("msg")
.innerText = "❌ Wrong Password"

}

}

/* LOAD TEAMS */

function loadTeams(){

let teams =
JSON.parse(localStorage.getItem("teams")) || []

let container =
document.getElementById("teams")

container.innerHTML = ""

/* NO TEAMS */

if(teams.length === 0){

container.innerHTML = `
<h3 style="text-align:center;">
No Teams Registered Yet
</h3>
`

return

}

/* SHOW TEAMS */

teams.forEach((team,index)=>{

let playersHTML = ""

let players = team.players || []

players.forEach((player,i)=>{

playersHTML += `

<input
type="text"
id="p${index}_${i}"
value="${player || ''}"
placeholder="Player ${i+1}">

`

})

container.innerHTML += `

<div class="card">

<h3>
${team.teamName || "Unknown Team"}
</h3>

<label>Captain</label>

<input
type="text"
id="captain${index}"
value="${team.captain || ''}">

<label>Vice Captain</label>

<input
type="text"
id="vice${index}"
value="${team.viceCaptain || ''}">

<label>Contact Number</label>

<input
type="text"
id="contact${index}"
value="${team.contact || ''}">

<h4 style="margin-top:15px;color:gold;">
🏏 Players Squad
</h4>

<div class="players">

${playersHTML}

</div>

<div class="btn-group">

<button
class="save-btn"
onclick="saveTeam(${index})">

Save

</button>

<button
class="delete-btn"
onclick="deleteTeam(${index})">

Delete

</button>

</div>

</div>

`

})

}

/* SAVE TEAM */

function saveTeam(index){

let teams =
JSON.parse(localStorage.getItem("teams")) || []

if(!teams[index]) return

/* UPDATE TEAM INFO */

teams[index].captain =
document.getElementById("captain"+index).value

teams[index].viceCaptain =
document.getElementById("vice"+index).value

teams[index].contact =
document.getElementById("contact"+index).value

/* UPDATE PLAYERS */

let updatedPlayers = []

let oldPlayers =
teams[index].players || []

for(let i=0;i<oldPlayers.length;i++){

let input =
document.getElementById(`p${index}_${i}`)

if(input){

updatedPlayers.push(input.value)

}

}

teams[index].players = updatedPlayers

/* SAVE */

localStorage.setItem(
"teams",
JSON.stringify(teams)
)

/* RELOAD */

loadTeams()

alert("✅ Team Updated Successfully")

}

/* DELETE TEAM */

function deleteTeam(index){

let teams =
JSON.parse(localStorage.getItem("teams")) || []

if(confirm("Delete this team permanently?")){

teams.splice(index,1)

localStorage.setItem(
"teams",
JSON.stringify(teams)
)

loadTeams()

}

}

</script>

</body>

</html>
