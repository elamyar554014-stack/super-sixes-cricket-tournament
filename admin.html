<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Super Sixes</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#04140f,#06261c);
color:white;
}

/* HEADER */

header{
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
padding:18px;
text-align:center;
font-size:24px;
color:gold;
font-weight:bold;
}

/* CONTAINER */

.container{
width:90%;
max-width:1100px;
margin:auto;
padding:20px;
}

/* LOGIN BOX */

#login{
text-align:center;
margin-top:100px;
}

input{
padding:12px;
margin:8px;
width:260px;
border:none;
border-radius:8px;
outline:none;
}

button{
padding:10px 18px;
background:gold;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffd700;
transform:scale(1.05);
}

#msg{
color:red;
font-weight:bold;
}

/* GRID */

#teams{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:20px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border:1px solid rgba(255,215,0,0.2);
padding:20px;
border-radius:15px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

/* TITLE */

.card h3{
color:gold;
margin-bottom:10px;
}

/* INPUTS */

.card input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:none;
}

/* PLAYERS GRID */

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:5px;
margin-top:10px;
}

/* BUTTON GROUP */

.btn-group{
display:flex;
justify-content:space-between;
margin-top:10px;
gap:10px;
}

.btn-group button{
flex:1;
}

/* HIDE */

.hidden{
display:none;
}

/* RESPONSIVE */

@media(max-width:600px){

input{
width:90%;
}

}

</style>

</head>

<body>

<header>
🔐 SUPER SIXES ADMIN PANEL
</header>

<!-- LOGIN -->

<div id="login">

<h2>Admin Login</h2>

<input type="password" id="password" placeholder="Enter Password">

<br>

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<!-- PANEL -->

<div class="container hidden" id="adminPanel">

<h2 style="text-align:center;color:gold;">Registered Teams</h2>

<div id="teams"></div>

</div>

<script>

/* LOGIN */

function login(){

let pass = document.getElementById("password").value

if(pass === "samikhan782"){

document.getElementById("login").classList.add("hidden")
document.getElementById("adminPanel").classList.remove("hidden")

loadTeams()

}else{

document.getElementById("msg").innerText = "❌ Wrong Password"

}

}

/* LOAD TEAMS */

function loadTeams(){

let teams = JSON.parse(localStorage.getItem("teams")) || []

let container = document.getElementById("teams")

container.innerHTML = ""

if(teams.length === 0){

container.innerHTML = "<h3 style='text-align:center;'>No Teams Registered Yet</h3>"
return

}

teams.forEach((team,index)=>{

let playersHTML = ""

let players = team.players || []

players.forEach((p,i)=>{

playersHTML += `
<input id="p${index}_${i}" value="${p || ''}">
`

})

container.innerHTML += `

<div class="card">

<h3>${team.teamName || "Unknown Team"}</h3>

<label>Captain</label>
<input id="captain${index}" value="${team.captain || ''}">

<label>Vice Captain</label>
<input id="vice${index}" value="${team.viceCaptain || ''}">

<label>Contact</label>
<input id="contact${index}" value="${team.contact || ''}">

<h4 style="color:gold;">Players</h4>

<div class="players">
${playersHTML}
</div>

<div class="btn-group">

<button onclick="saveTeam(${index})">Save</button>
<button onclick="deleteTeam(${index})">Delete</button>

</div>

</div>

`

})

}

/* SAVE */

function saveTeam(index){

let teams = JSON.parse(localStorage.getItem("teams")) || []

if(!teams[index]) return

teams[index].captain = document.getElementById("captain"+index).value
teams[index].viceCaptain = document.getElementById("vice"+index).value
teams[index].contact = document.getElementById("contact"+index).value

let players = teams[index].players || []

for(let i=0;i<players.length;i++){

let el = document.getElementById(`p${index}_${i}`)
if(el) players[i] = el.value

}

teams[index].players = players

localStorage.setItem("teams", JSON.stringify(teams))

alert("✅ Team Updated Successfully")

}

/* DELETE */

function deleteTeam(index){

let teams = JSON.parse(localStorage.getItem("teams")) || []

if(confirm("Delete this team permanently?")){

teams.splice(index,1)

localStorage.setItem("teams", JSON.stringify(teams))

loadTeams()

}

}

</script>

</body>
</html>
