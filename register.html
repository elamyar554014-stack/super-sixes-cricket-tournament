<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Registration | SUPER SIXES</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071a14;
color:white;
padding:30px 15px;
}

.container{
max-width:900px;
margin:auto;
background:#0d2d24;
padding:25px;
border-radius:20px;
border:1px solid rgba(255,215,0,0.15);
}

/* TITLE */

h1{
text-align:center;
color:gold;
margin-bottom:25px;
font-size:40px;
}

/* BACK BUTTON */

.back-btn{
display:inline-block;
background:gold;
color:black;
padding:10px 20px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
margin-bottom:20px;
}

.back-btn:hover{
background:white;
}

/* INPUT */

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

/* FILE */

input[type="file"]{
background:white;
color:black;
}

/* BUTTON */

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:gold;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:white;
transform:scale(1.02);
}

/* PLAYER TITLE */

.player-title{
margin-top:20px;
margin-bottom:10px;
font-size:22px;
color:gold;
}

/* MESSAGE */

#msg{
text-align:center;
margin-top:15px;
font-weight:bold;
font-size:18px;
color:lightgreen;
}

/* PREVIEW */

#preview{
display:none;
width:130px;
height:130px;
object-fit:cover;
border-radius:15px;
border:3px solid gold;
margin:15px auto;
background:white;
}

/* RESPONSIVE */

@media(max-width:600px){

h1{
font-size:30px;
}

.container{
padding:18px;
}

}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back-btn">
← Back Home
</a>

<h1>🏏 Team Registration</h1>

<!-- TEAM DETAILS -->

<input
type="text"
id="teamName"
placeholder="Team Name">

<input
type="text"
id="captain"
placeholder="Captain Name">

<input
type="text"
id="viceCaptain"
placeholder="Vice Captain Name">

<input
type="text"
id="contact"
placeholder="Contact Number">

<!-- LOGO -->

<input
type="file"
id="logo"
accept="image/*">

<img id="preview">

<!-- PLAYERS -->

<h3 class="player-title">
🏏 Players Squad
</h3>

<div id="players"></div>

<!-- BUTTON -->

<button onclick="registerTeam()">
Register Team
</button>

<div id="msg"></div>

</div>

<script>

/* CREATE PLAYER INPUTS */

const playersDiv =
document.getElementById("players")

for(let i=1;i<=16;i++){

let input =
document.createElement("input")

input.type = "text"

input.id = "p"+i

input.placeholder = "Player " + i

/* MOVE TO NEXT INPUT */

input.addEventListener("keydown",function(event){

if(event.key === "Enter"){

event.preventDefault()

let next =
document.getElementById("p"+(i+1))

if(next){

next.focus()

}

}

})

playersDiv.appendChild(input)

}

/* MAIN INPUTS NEXT */

document.getElementById("teamName")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault()

document.getElementById("captain").focus()

}

})

document.getElementById("captain")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault()

document.getElementById("viceCaptain").focus()

}

})

document.getElementById("viceCaptain")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault()

document.getElementById("contact").focus()

}

})

document.getElementById("contact")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault()

document.getElementById("p1").focus()

}

})

/* LOGO PREVIEW */

document.getElementById("logo")
.addEventListener("change",function(event){

const file = event.target.files[0]

if(!file) return

const reader = new FileReader()

reader.onload = function(e){

const preview =
document.getElementById("preview")

preview.src = e.target.result

preview.style.display = "block"

}

reader.readAsDataURL(file)

})

/* REGISTER TEAM */

function registerTeam(){

let teamName =
document.getElementById("teamName")
.value.trim()

let captain =
document.getElementById("captain")
.value.trim()

let viceCaptain =
document.getElementById("viceCaptain")
.value.trim()

let contact =
document.getElementById("contact")
.value.trim()

/* VALIDATION */

if(teamName === ""){

alert("Enter Team Name")

return

}

/* TEAMS */

let teams =
JSON.parse(localStorage.getItem("teams")) || []

/* DUPLICATE CHECK */

let exists = teams.some(team => {

return (
team.teamName &&
team.teamName.toLowerCase() ===
teamName.toLowerCase()
)

})

if(exists){

alert("❌ Team Name Already Exists")

return

}

/* PLAYERS */

let players = []

for(let i=1;i<=16;i++){

players.push(
document.getElementById("p"+i)
.value.trim()
)

}

/* LOGO */

const file =
document.getElementById("logo")
.files[0]

if(!file){

alert("Select Team Logo")

return

}

const reader = new FileReader()

reader.onload = function(e){

let team = {

teamName:teamName,
captain:captain,
viceCaptain:viceCaptain,
contact:contact,
players:players,
logo:e.target.result

}

/* SAVE */

teams.push(team)

localStorage.setItem(
"teams",
JSON.stringify(teams)
)

/* MESSAGE */

document.getElementById("msg")
.innerText =
"✅ Team Registered Successfully"

/* RELOAD */

setTimeout(function(){

location.reload()

},1200)

}

reader.readAsDataURL(file)

}

</script>

</body>

</html>
