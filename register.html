<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Registration</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#061f17;
font-family:Arial;
color:white;
margin:0;
}

.container{
width:90%;
max-width:900px;
margin:auto;
padding:30px;
}

.title{
text-align:center;
color:gold;
margin-bottom:30px;
}

.form-card{
background:#0d3b2e;
padding:30px;
border-radius:10px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
}

label{
font-weight:bold;
}

.logo-preview{
text-align:center;
margin-top:10px;
}

.logo-preview img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:2px solid gold;
}

.squad-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:20px;
}

.player-box{
background:#08291f;
padding:10px;
border-radius:6px;
}

button{
width:100%;
padding:15px;
background:gold;
border:none;
border-radius:6px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

button:hover{
background:#ffd700;
}

.success{
text-align:center;
margin-top:15px;
color:lightgreen;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">🏏 Team Registration</h1>

<div class="form-card">

<label>Team Name</label>
<input id="teamName" placeholder="Enter Team Name">

<label>Captain Name</label>
<input id="captain" placeholder="Enter Captain Name">

<label>Vice Captain Name</label>
<input id="viceCaptain" placeholder="Enter Vice Captain Name">

<label>Contact Number</label>
<input id="contact" placeholder="Enter Contact Number">

<label>Team Logo</label>
<input type="file" id="logo" accept="image/*" onchange="previewLogo(event)">

<div class="logo-preview">
<img id="logoPreview" src="" style="display:none;">
</div>

<h3>Squad (16 Players)</h3>

<div class="squad-grid" id="players"></div>

<button onclick="registerTeam()">Register Team</button>

<p class="success" id="msg"></p>

</div>

</div>


<script>

let playersDiv=document.getElementById("players")

for(let i=1;i<=16;i++){

let box=document.createElement("div")
box.className="player-box"

box.innerHTML=`<input placeholder="Player ${i}" id="p${i}">`

playersDiv.appendChild(box)

}


function previewLogo(event){

let reader=new FileReader()

reader.onload=function(){

let img=document.getElementById("logoPreview")

img.src=reader.result
img.style.display="block"

}

reader.readAsDataURL(event.target.files[0])

}


function registerTeam(){

let players=[]

for(let i=1;i<=16;i++){

players.push(document.getElementById("p"+i).value)

}

let logoFile=document.getElementById("logo").files[0]

let reader=new FileReader()

reader.onload=function(){

let team={

teamName:teamName.value,
captain:captain.value,
viceCaptain:viceCaptain.value,
contact:contact.value,
logo:reader.result,
players:players

}

let teams=JSON.parse(localStorage.getItem("teams")) || []

teams.push(team)

localStorage.setItem("teams",JSON.stringify(teams))

msg.innerText="Your team has been successfully registered in SUPER SIXES CRICKET TOURNAMENT."

}

if(logoFile){

reader.readAsDataURL(logoFile)

}

}

</script>

</body>

</html>
