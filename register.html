<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Registration | SUPER SIXES</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071a14;
color:white;
min-height:100vh;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

/* TITLE */

h1{
text-align:center;
color:gold;
margin-bottom:25px;
font-size:42px;
}

/* FORM BOX */

.form-box{
background:#0d2d24;
padding:25px;
border-radius:20px;
border:1px solid rgba(255,215,0,0.15);
}

/* INPUT */

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

/* FILE INPUT */

input[type="file"]{
background:white;
color:black;
}

/* BUTTON */

button{
padding:14px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:10px;
margin-top:15px;
width:100%;
font-size:16px;
transition:0.3s;
}

button:hover{
background:white;
transform:scale(1.02);
}

/* PLAYER BOX */

.player-box{
margin:5px 0;
}

/* MESSAGE */

#msg{
text-align:center;
margin-top:18px;
color:lightgreen;
font-weight:bold;
font-size:18px;
}

/* LOGO PREVIEW */

#preview{
display:none;
width:130px;
height:130px;
object-fit:cover;
margin:15px auto;
border-radius:15px;
border:3px solid gold;
display:block;
background:white;
}

/* SECTION TITLE */

.section-title{
margin-top:20px;
margin-bottom:10px;
color:gold;
font-size:22px;
}

/* BACK BUTTON */

.back-btn{
display:inline-block;
margin-bottom:20px;
background:gold;
color:black;
padding:10px 18px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
}

.back-btn:hover{
background:white;
}

/* RESPONSIVE */

@media(max-width:600px){

h1{
font-size:32px;
}

.container{
padding:20px 12px;
}

}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back-btn">
← Back Home
</a>

<h1>🏏 Team Registration</h1>

<div class="form-box">

<input
id="teamName"
placeholder="Team Name"
onkeydown="moveNext(event,'captain')">

<input
id="captain"
placeholder="Captain Name"
onkeydown="moveNext(event,'viceCaptain')">

<input
id="viceCaptain"
placeholder="Vice Captain Name"
onkeydown="moveNext(event,'contact')">

<input
id="contact"
placeholder="Contact Number"
onkeydown="moveNext(event,'p1')">

<input type="file" id="logo">

<img id="preview">

<h3 class="section-title">
🏏 Players Squad
</h3>

<div id="players"></div>

<button onclick="registerTeam()">

Register Team

</button>

<div id="msg"></div>

</div>

</div>

<script>

/* MOVE TO NEXT INPUT */

function moveNext(event,nextId){

if(event.key === "Enter"){

event.preventDefault()

let nextInput =
document.getElementById(nextId)

if(nextInput){

nextInput.focus()

}

}

}

/* PAGE LOADED */

document.addEventListener("DOMContentLoaded", function () {

const playersDiv =
document.getElementById("players")

/* CREATE 16 PLAYER INPUTS */

let html = ""

for(let i = 1; i <= 16; i++){

let nextField = "p" + (i + 1)

if(i === 16){

nextField = ""

}

html += `

<div class="player-box">

<input
type="text"
id="p${i}"
placeholder="Player ${i}"
onkeydown="moveNext(event,'${nextField}')">

</div>

`

}

playersDiv.innerHTML = html

/* LOGO PREVIEW */

document.getElementById("logo")
.addEventListener("change", function(event){

const file = event.target.files[0]

if(!file) return

const reader = new FileReader()

reader.onload = function(e){

const preview =
document.getElementById("preview")

preview.src = e.target.result

preview.style.display = "block"

}

reader.readAsDataURL(file)

})

/* REGISTER TEAM */

window.registerTeam = function(){

let teamName =
document.getElementById("teamName")
.value.trim()

let captain =
document.getElementById("captain")
.value.trim()

let viceCaptain =
document.getElementById("viceCaptain")
.value.trim()

let contact =
document.getElementById("contact")
.value.trim()

/* CLEAN NAME */

let cleanTeamName =
teamName.replace(/\s+/g, " ").toLowerCase()

if(!teamName){

alert("Enter Team Name")

return

}

/* GET TEAMS */

let teams =
JSON.parse(localStorage.getItem("teams") || "[]")

/* DUPLICATE CHECK */

let exists = teams.some(t => {

let existingName =
(t.teamName || "")
.replace(/\s+/g, " ")
.toLowerCase()

return existingName === cleanTeamName

})

if(exists){

alert("❌ Team Name Already Exists")

return

}

/* PLAYERS */

let players = []

for(let i = 1; i <= 16; i++){

players.push(
document.getElementById("p"+i)
.value.trim()
)

}

/* LOGO */

const file =
document.getElementById("logo")
.files[0]

if(!file){

alert("Select Team Logo")

return

}

const reader = new FileReader()

reader.onload = function(e){

let team = {

teamName,
captain,
viceCaptain,
contact,
players,
logo:e.target.result

}

/* SAVE */

teams.push(team)

localStorage.setItem(
"teams",
JSON.stringify(teams)
)

document.getElementById("msg")
.innerText =
"✅ Team Registered Successfully!"

setTimeout(() => {

location.reload()

},1200)

}

reader.readAsDataURL(file)

}

})

</script>

</body>

</html>
