<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Registration</title>

<style>

body{
margin:0;
font-family:Arial;
background:#071a14;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:gold;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:6px;
outline:none;
}

button{
padding:12px 20px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
margin-top:10px;
width:100%;
}

button:hover{
background:white;
}

.player-box{
margin:5px 0;
}

#msg{
text-align:center;
margin-top:15px;
color:lightgreen;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🏏 Team Registration</h1>

<input id="teamName" placeholder="Team Name">
<input id="captain" placeholder="Captain Name">
<input id="viceCaptain" placeholder="Vice Captain Name">
<input id="contact" placeholder="Contact Number">

<input type="file" id="logo">
<img id="preview" style="display:none;width:120px;margin-top:10px;border-radius:10px;">

<h3>Players</h3>
<div id="players"></div>

<button onclick="registerTeam()">Register Team</button>

<div id="msg"></div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

const playersDiv = document.getElementById("players");

/* CREATE 16 PLAYER INPUTS */
let html = "";
for (let i = 1; i <= 16; i++) {
    html += `
    <div class="player-box">
        <input type="text" id="p${i}" placeholder="Player ${i}">
    </div>`;
}
playersDiv.innerHTML = html;

/* LOGO PREVIEW */
document.getElementById("logo").addEventListener("change", function (event) {

const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();

reader.onload = function (e) {
    const preview = document.getElementById("preview");
    preview.src = e.target.result;
    preview.style.display = "block";
};

reader.readAsDataURL(file);

});

/* REGISTER TEAM */
window.registerTeam = function () {

let teamName = document.getElementById("teamName").value.trim();
let captain = document.getElementById("captain").value.trim();
let viceCaptain = document.getElementById("viceCaptain").value.trim();
let contact = document.getElementById("contact").value.trim();

/* CLEAN NAME (IMPORTANT FIX) */
teamName = teamName.replace(/\s+/g, " ").toLowerCase();

if (!teamName) {
    alert("Enter Team Name");
    return;
}

let teams = JSON.parse(localStorage.getItem("teams") || "[]");

/* STRICT DUPLICATE CHECK */
let exists = teams.some(t => {
    let existingName = (t.teamName || "").replace(/\s+/g, " ").toLowerCase();
    return existingName === teamName;
});

if (exists) {
    alert("❌ Team name already exists! Choose another name.");
    return;
}

/* COLLECT PLAYERS */
let players = [];
for (let i = 1; i <= 16; i++) {
    players.push(document.getElementById("p" + i).value.trim());
}

/* LOGO */
const file = document.getElementById("logo").files[0];

if (!file) {
    alert("Select Team Logo");
    return;
}

const reader = new FileReader();

reader.onload = function (e) {

let team = {
    teamName,
    captain,
    viceCaptain,
    contact,
    players,
    logo: e.target.result
};

teams.push(team);
localStorage.setItem("teams", JSON.stringify(teams));

document.getElementById("msg").innerText =
"✅ Team Registered Successfully!";

setTimeout(() => location.reload(), 1200);

};

reader.readAsDataURL(file);

};

});

</script>

</body>
</html>
