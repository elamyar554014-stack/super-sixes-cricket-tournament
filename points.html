```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Points Table | Super Sixes</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --dark:#0A1B13;
  --panel:#102A1D;
  --panel2:#0D2318;
  --cream:#F1EAD8;
  --dim:#B9AF98;
  --gold:#D9A441;
  --green:#7FB37A;
  --red:#C0392B;
  --line:rgba(241,234,216,.15);
}

* { box-sizing:border-box; margin:0; }

body {
  background:var(--dark);
  color:var(--cream);
  font-family:'Work Sans',sans-serif;
  padding-bottom:60px;
}

header {
  padding:22px 6%;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

h1,h2,h3 {
  font-family:'Bebas Neue',sans-serif;
  font-weight:400;
}

h1 { font-size:28px; }

header a {
  color:var(--cream);
  text-decoration:none;
  border:1px solid var(--line);
  padding:10px 15px;
}

.container {
  max-width:1000px;
  margin:40px auto;
  padding:0 5%;
}

.heading {
  display:flex;
  justify-content:space-between;
  align-items:end;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.heading h2 { font-size:30px; }

.note {
  font:10px 'Space Mono',monospace;
  color:var(--dim);
  letter-spacing:1px;
}

.table-wrap {
  overflow-x:auto;
  margin-bottom:40px;
}

table {
  width:100%;
  min-width:550px;
  border-collapse:collapse;
  background:var(--panel2);
}

th {
  background:var(--gold);
  color:var(--dark);
  font:11px 'Space Mono',monospace;
  padding:13px;
  text-align:center;
}

th:first-child,td:first-child { text-align:left; }

td {
  padding:13px;
  border-bottom:1px solid var(--line);
  text-align:center;
  font-size:14px;
}

.team-name { font-weight:700; }

.rank {
  display:inline-block;
  width:28px;
  color:var(--dim);
  font:12px 'Space Mono',monospace;
}

.points {
  color:var(--gold);
  font-weight:700;
}

.positive { color:var(--green); }
.negative { color:#e47768; }

.empty {
  background:var(--panel);
  padding:35px;
  text-align:center;
  color:var(--dim);
  line-height:1.7;
}

.fixture-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.fixture {
  background:var(--panel);
  border-left:3px solid var(--green);
  padding:18px;
}

.fixture.pending { border-left-color:var(--gold); }

.fixture h3 {
  color:var(--gold);
  font-size:17px;
  margin-bottom:12px;
}

.fixture p {
  padding:8px 0;
  border-bottom:1px solid var(--line);
}

.fixture small {
  display:block;
  margin-top:12px;
  color:var(--dim);
}

.winner { color:var(--green); font-weight:700; }

@media(max-width:600px) {
  h1 { font-size:23px; }
  .container { margin-top:28px; }
}
</style>
</head>

<body>

<header>
  <h1>SUPER SIXES — POINTS TABLE</h1>
  <a href="index.html">← Back Home</a>
</header>

<main class="container">

  <section>
    <div class="heading">
      <h2>TEAM STANDINGS</h2>
      <span id="tableNote" class="note"></span>
    </div>

    <div id="tableArea"></div>
  </section>

  <section style="margin-top:40px">
    <div class="heading">
      <h2>KNOCKOUT FIXTURES</h2>
      <span class="note">MATCH RESULTS</span>
    </div>

    <div id="fixtures" class="fixture-grid"></div>
  </section>

</main>

<script>
function readData(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch {
    return fallback;
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function getStandings() {
  const teams = readData("teams", []);
  const matches = readData("matches", []);
  const stats = {};

  function ensure(name) {
    if (!stats[name]) {
      stats[name] = {
        name,
        matches:0,
        wins:0,
        losses:0,
        points:0,
        runsFor:0,
        runsAgainst:0,
        ballsFor:0,
        ballsAgainst:0
      };
    }
    return stats[name];
  }

  teams.forEach(t => ensure(t.teamName));

  matches.filter(m => m.status === "completed").forEach(m => {
    const a = ensure(m.teamA);
    const b = ensure(m.teamB);

    a.matches++;
    b.matches++;

    a.runsFor += Number(m.scoreA) || 0;
    a.runsAgainst += Number(m.scoreB) || 0;

    b.runsFor += Number(m.scoreB) || 0;
    b.runsAgainst += Number(m.scoreA) || 0;

    const ballsA = Number(m.oversABalls) ||
      Math.round((Number(m.oversA) || 0) * 6);

    const ballsB = Number(m.oversBBalls) ||
      Math.round((Number(m.oversB) || 0) * 6);

    a.ballsFor += ballsA;
    a.ballsAgainst += ballsB;

    b.ballsFor += ballsB;
    b.ballsAgainst += ballsA;

    if (m.winner === m.teamA) {
      a.wins++;
      b.losses++;
      a.points += 2;
    } else if (m.winner === m.teamB) {
      b.wins++;
      a.losses++;
      b.points += 2;
    }
  });

  return Object.values(stats).map(t => ({
    ...t,
    nrr:
      (t.ballsFor ? t.runsFor / (t.ballsFor / 6) : 0) -
      (t.ballsAgainst ? t.runsAgainst / (t.ballsAgainst / 6) : 0)
  })).sort((a,b) =>
    b.points - a.points || b.nrr - a.nrr
  );
}

function renderPointsTable() {
  const rows = getStandings();

  document.getElementById("tableNote").textContent =
    rows.length + " TEAMS • SORTED BY POINTS";

  const area = document.getElementById("tableArea");

  if (!rows.length) {
    area.innerHTML = `
      <div class="empty">
        No teams registered yet.<br>
        Register teams in the Admin Panel to begin.
      </div>`;
    return;
  }

  area.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Team</th>
            <th>M</th>
            <th>W</th>
            <th>L</th>
            <th>Pts</th>
            <th>NRR</th>
          </tr>
        </thead>

        <tbody>
          ${rows.map((t,i) => `
            <tr>
              <td>
                <span class="rank">${i+1}</span>
                <span class="team-name">${escapeHTML(t.name)}</span>
              </td>
              <td>${t.matches}</td>
              <td>${t.wins}</td>
              <td>${t.losses}</td>
              <td class="points">${t.points}</td>
              <td class="${t.nrr>0?'positive':t.nrr<0?'negative':''}">
                ${t.nrr>0?'+':''}${t.nrr.toFixed(2)}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>`;
}

function renderFixtures() {
  const matches = readData("matches", []);
  const root = document.getElementById("fixtures");

  if (!matches.length) {
    root.innerHTML = `
      <div class="empty">
        No fixtures have been generated yet.
      </div>`;
    return;
  }

  root.innerHTML = [...matches]
    .sort((a,b) => (a.roundNumber || 1) - (b.roundNumber || 1))
    .map(m => `
      <article class="fixture ${m.status === "pending" ? "pending" : ""}">
        <h3>${escapeHTML(m.round || "Match")}</h3>

        <p class="${m.winner === m.teamA ? "winner" : ""}">
          ${escapeHTML(m.teamA)}
          ${m.status === "completed" ? "(" + m.scoreA + ")" : ""}
        </p>

        <p class="${m.winner === m.teamB ? "winner" : ""}">
          ${escapeHTML(m.teamB)}
          ${m.status === "completed" ? "(" + m.scoreB + ")" : ""}
        </p>

        <small>
          ${m.status === "completed"
            ? "Winner: " + escapeHTML(m.winner)
            : m.status === "bye"
              ? "Bye — advances automatically"
              : "Awaiting result"}
        </small>
      </article>
    `).join("");
}

function renderPage() {
  renderPointsTable();
  renderFixtures();
}

renderPage();

/* Refresh if another open page changes tournament data. */
window.addEventListener("storage", renderPage);

/* Refresh this page when revisited or focused. */
window.addEventListener("focus", renderPage);
</script>

</body>
</html>
