<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registered Teams | SUPER SIXES</title>

<style>

body{
margin:0;
font-family:Arial;
background:#071a14;
color:white;
padding:40px 6%;
}

/* TOP BAR */

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:40px;
}

.title{
font-size:42px;
color:gold;
font-weight:bold;
}

.back-btn{
background:gold;
color:black;
padding:12px 22px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
}

/* GRID */

.teams-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px;
}

/* CARD */

.team-card{
background:#0d2d24;
padding:22px;
border-radius:18px;
border:1px solid rgba(255,215,0,0.2);
}

/* LOGO */

.team-logo{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid gold;
display:block;
margin:auto;
background:white;
}

/* TEAM NAME */

.team-name{
text-align:center;
font-size:28px;
color:gold;
margin:15px 0;
font-weight:bold;
}

/* INFO */

.row{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
font-size:15px;
color:#ddd;
}

/* SQUAD */

.squad-title{
margin-top:15px;
text-align:center;
color:gold;
font-weight:bold;
font-size:18px;
}

.player{
background:#082019;
margin:5px 0;
padding:8px;
border-radius:8px;
font-size:14px;
border-left:3px solid gold;
}

/* STATUS */

.status{
margin-top:15px;
text-align:center;
background:#082019;
padding:10px;
border-radius:10px;
color:lightgreen;
font-weight:bold;
}

/* EMPTY */

.empty{
text-align:center;
font-size:26px;
color:gold;
margin-top:80px;
}

/* DEBUG */

.debug{
text-align:center;
color:red;
margin-bottom:20px;
font-size:14px;
}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">

<h1 class="title">🏏 REGISTERED TEAMS</h1>

<a class="back-btn" href="index.html">← Back Home</a>

</div>

<!-- DEBUG MESSAGE (helps detect wrong page opening) -->
<div id="debug" class="debug"></div>

<!-- TEAMS -->

<div class="teams-container" id="teamsContainer"></div>

<script>

/* SHOW PAGE LOADED CONFIRMATION */
document.getElementById("debug").innerText = "Teams page loaded successfully ✔";

/* LOAD TEAMS */
function loadTeams(){

let container = document.getElementById("teamsContainer");

if(!container){
    console.error("Container missing");
    return;
}

let teams = [];

try {
    teams = JSON.parse(localStorage.getItem("teams")) || [];
} catch (e) {
    teams = [];
}

if (!Array.isArray(teams) || teams.length === 0) {
    container.innerHTML = `<div class="empty">No Teams Registered Yet</div>`;
    return;
}

container.innerHTML = "";

teams.forEach(team => {

let playersHTML = "";

/* SAFE SQUAD BUILD */
if (Array.isArray(team.players)) {
    team.players.forEach((p, i) => {
        if (p && p.trim() !== "") {
            playersHTML += `<div class="player">Player ${i + 1}: ${p}</div>`;
        }
    });
}

container.innerHTML += `
<div class="team-card">

    <img class="team-logo"
    src="${team?.logo || 'https://cdn-icons-png.flaticon.com/512/857/857455.png'}">

    <div class="team-name">
        ${team?.teamName || "Unknown Team"}
    </div>

    <div class="row">
        <span>Captain</span>
        <span>${team?.captain || "Not Set"}</span>
    </div>

    <div class="row">
        <span>Vice Captain</span>
        <span>${team?.viceCaptain || "Not Set"}</span>
    </div>

    <div class="row">
        <span>📱 Mobile Number</span>
        <span>${team?.contact || "Not Set"}</span>
    </div>

    <div class="row">
        <span>Total Players</span>
        <span>${team?.players?.filter(p => p).length || 0}</span>
    </div>

    <div class="squad-title">🏏 Full Squad</div>

    ${playersHTML || "<div class='player'>No players added</div>"}

    <div class="status">✔ Registered Successfully</div>

</div>
`;

});

}

/* RUN */
loadTeams();

</script>

</body>
</html>
