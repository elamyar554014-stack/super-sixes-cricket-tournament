<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Teams | Super Sixes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

  :root{
    --turf-dark:    #0A1B13;
    --turf-panel:   #102A1D;
    --turf-panel-2: #0D2318;
    --cream:        #F1EAD8;
    --cream-dim:    #B9AF98;
    --ball-red:     #C0392B;
    --gold:         #D9A441;
    --run-green:    #7FB37A;
    --hairline:         rgba(241,234,216,0.14);
    --hairline-strong:  rgba(241,234,216,0.26);

    --font-display: 'Bebas Neue', sans-serif;
    --font-body:    'Work Sans', sans-serif;
    --font-mono:    'Space Mono', monospace;
  }

  *{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }

  body{
    background:var(--turf-dark);
    color:var(--cream);
    padding:50px 6% 80px;
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  /* ============ TOP BAR ============ */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
    padding-bottom:22px;
    border-bottom:1px solid var(--hairline-strong);
  }

  .title-block{ text-align:left; }

  .title{
    font-family:var(--font-display);
    font-size:clamp(32px, 5vw, 46px);
    letter-spacing:0.5px;
    line-height:1;
  }

  .title span{ color:var(--ball-red); }

  .count{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    color:var(--cream-dim);
    margin-top:8px;
  }

  .count b{ color:var(--gold); font-weight:400; }

  .back-btn{
    border:1px solid var(--hairline-strong);
    color:var(--cream);
    padding:12px 22px;
    border-radius:3px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    transition:0.25s ease;
    white-space:nowrap;
  }

  .back-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
  }

  /* ============ SEARCH ============ */
  .search-row{
    margin-bottom:32px;
  }

  .search-row input{
    width:100%;
    max-width:360px;
    padding:12px 14px;
    border-radius:3px;
    background:var(--turf-panel-2);
    color:var(--cream);
    border:1px solid var(--hairline-strong);
    font-family:var(--font-body);
    font-size:14px;
    transition:0.2s ease;
  }

  .search-row input::placeholder{ color:var(--cream-dim); opacity:0.7; }

  .search-row input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(217,164,65,0.18);
  }

  /* ============ GRID ============ */
  .teams-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:24px;
  }

  /* ============ TEAM CARD ============ */
  .team-card{
    background:var(--turf-panel);
    border-left:3px solid var(--ball-red);
    border-top:1px solid transparent;
    border-right:1px solid transparent;
    border-bottom:1px solid transparent;
    padding:26px 26px 22px;
    opacity:0;
    animation:fadeUp 0.5s ease forwards;
    transition:border-color 0.25s ease, transform 0.25s ease;
  }

  .team-card:hover{
    transform:translateY(-4px);
    border-top-color:var(--hairline-strong);
    border-right-color:var(--hairline-strong);
    border-bottom-color:var(--hairline-strong);
  }

  .team-head{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }

  .team-logo{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--hairline-strong);
    background:var(--cream);
    flex-shrink:0;
    transition:border-color 0.25s ease;
  }

  .team-card:hover .team-logo{
    border-color:var(--gold);
  }

  .team-name{
    font-family:var(--font-display);
    font-size:24px;
    letter-spacing:0.3px;
    line-height:1.15;
    color:var(--cream);
    text-align:left;
  }

  /* INFO ROW */
  .row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--hairline);
    font-size:14px;
    color:var(--cream-dim);
  }

  .row span:last-child{
    color:var(--cream);
    font-weight:500;
    text-align:right;
  }

  /* SQUAD */
  .squad-title{
    margin-top:20px;
    margin-bottom:10px;
    color:var(--gold);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1.5px;
  }

  .squad-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:6px;
  }

  .player{
    background:var(--turf-panel-2);
    padding:9px 11px;
    border-radius:2px;
    font-size:13px;
    color:var(--cream-dim);
    display:flex;
    gap:8px;
    align-items:baseline;
    overflow:hidden;
  }

  .player .num{
    font-family:var(--font-mono);
    color:var(--gold);
    flex-shrink:0;
    font-size:11px;
  }

  .player span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* STATUS */
  .status{
    margin-top:16px;
    padding:10px;
    text-align:center;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--run-green);
    border:1px solid rgba(127,179,122,0.3);
    background:rgba(127,179,122,0.08);
  }

  /* EMPTY */
  .empty{
    text-align:center;
    margin-top:90px;
    padding:60px 20px;
    border:1px dashed var(--hairline-strong);
  }

  .empty .ball{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--ball-red);
    margin:0 auto 20px;
    position:relative;
  }
  .empty .ball::before,
  .empty .ball::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:34px; height:1px;
    background:var(--cream);
    opacity:0.85;
  }
  .empty .ball::before{ transform:translate(-50%,-50%) rotate(20deg); }
  .empty .ball::after{ transform:translate(-50%,-50%) rotate(-20deg); }

  .empty h2{
    font-family:var(--font-display);
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--cream);
    font-weight:400;
    margin-bottom:10px;
  }

  .empty p{
    color:var(--cream-dim);
    font-size:14px;
    margin-bottom:22px;
  }

  .empty a{
    display:inline-block;
    background:var(--ball-red);
    color:var(--cream);
    padding:12px 26px;
    border-radius:3px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    transition:0.2s ease;
  }

  .empty a:hover{
    background:#a5301f;
  }

  .no-results{
    text-align:center;
    grid-column:1 / -1;
    color:var(--cream-dim);
    font-family:var(--font-mono);
    font-size:13px;
    padding:60px 0;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .team-card{ animation:none; opacity:1; }
  }

  /* RESPONSIVE */
  @media(max-width:768px){
    body{ padding:36px 5% 60px; }
  }

</style>

</head>

<body>

<div class="top-bar">
  <div class="title-block">
    <h1 class="title">Registered <span>Teams</span></h1>
    <div class="count" id="teamCount"></div>
  </div>
  <a href="index.html" class="back-btn">&larr; Back Home</a>
</div>

<div class="search-row">
  <input id="searchInput" type="text" placeholder="Search by team or captain...">
</div>

<div class="teams-container" id="teamsContainer"></div>

<script>

let allTeams = []

function loadTeams(){

  let container = document.getElementById("teamsContainer")
  let countEl = document.getElementById("teamCount")

  let teams = []

  try{
    teams = JSON.parse(localStorage.getItem("teams")) || []
  }catch(error){
    teams = []
  }

  allTeams = Array.isArray(teams) ? teams : []

  if(allTeams.length === 0){
    countEl.innerText = ""
    container.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="ball"></div>
        <h2>No Teams Registered Yet</h2>
        <p>Be the first squad to lock in your spot in the draw.</p>
        <a href="register.html">Register Your Team</a>
      </div>
    `
    return
  }

  countEl.innerHTML = `<b>${allTeams.length}</b> team${allTeams.length === 1 ? "" : "s"} registered`

  renderTeams(allTeams)

}

function renderTeams(teams){

  let container = document.getElementById("teamsContainer")

  if(teams.length === 0){
    container.innerHTML = `<div class="no-results">No teams match your search</div>`
    return
  }

  container.innerHTML = ""

  teams.forEach((team, i) => {

    let playersHTML = ""

    if(Array.isArray(team.players)){
      team.players.forEach((player,index)=>{
        if(player && player.trim() !== ""){
          playersHTML += `
            <div class="player">
              <span class="num">${String(index+1).padStart(2,'0')}</span>
              <span>${player}</span>
            </div>
          `
        }
      })
    }

    if(playersHTML === ""){
      playersHTML = `<div class="player">No Players Added</div>`
    }

    container.innerHTML += `

      <div class="team-card" style="animation-delay:${Math.min(i,8) * 0.06}s">

        <div class="team-head">
          <img class="team-logo" src="${team.logo || 'https://cdn-icons-png.flaticon.com/512/857/857455.png'}">
          <div class="team-name">${team.teamName || "Unknown Team"}</div>
        </div>

        <div class="row">
          <span>Captain</span>
          <span>${team.captain || "Not Set"}</span>
        </div>

        <div class="row">
          <span>Vice Captain</span>
          <span>${team.viceCaptain || "Not Set"}</span>
        </div>

        <div class="row">
          <span>Contact</span>
          <span>${team.contact || "Not Set"}</span>
        </div>

        <div class="row">
          <span>Total Players</span>
          <span>${team.players?.filter(p => p && p.trim() !== "").length || 0}</span>
        </div>

        <div class="squad-title">FULL SQUAD</div>

        <div class="squad-grid">
          ${playersHTML}
        </div>

        <div class="status">Registered Successfully</div>

      </div>

    `

  })

}

document.getElementById("searchInput").addEventListener("input", function(e){
  let q = e.target.value.trim().toLowerCase()
  if(q === ""){
    renderTeams(allTeams)
    return
  }
  let filtered = allTeams.filter(team =>
    (team.teamName || "").toLowerCase().includes(q) ||
    (team.captain || "").toLowerCase().includes(q)
  )
  renderTeams(filtered)
})

loadTeams()

window.addEventListener("storage", function(){
  loadTeams()
})

</script>

</body>
</html>
