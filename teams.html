<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registered Teams | SUPER SIXES</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071a14;
color:white;
padding:40px 6%;
}

/* TOP BAR */

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:40px;
}

.title{
font-size:42px;
color:gold;
font-weight:bold;
}

.back-btn{
background:gold;
color:black;
padding:12px 22px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.back-btn:hover{
background:white;
}

/* GRID */

.teams-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px;
}

/* TEAM CARD */

.team-card{
background:#0d2d24;
padding:22px;
border-radius:18px;
border:1px solid rgba(255,215,0,0.15);
transition:0.3s;
}

.team-card:hover{
transform:translateY(-6px);
box-shadow:0 10px 25px rgba(0,0,0,0.45);
}

/* TEAM LOGO */

.team-logo{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid gold;
display:block;
margin:auto;
background:white;
}

/* TEAM NAME */

.team-name{
text-align:center;
font-size:28px;
font-weight:bold;
color:gold;
margin:16px 0;
}

/* INFO ROW */

.row{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:15px;
color:#ddd;
}

/* SQUAD TITLE */

.squad-title{
margin-top:18px;
margin-bottom:10px;
text-align:center;
color:gold;
font-size:19px;
font-weight:bold;
}

/* PLAYER */

.player{
background:#082019;
padding:10px;
margin:6px 0;
border-radius:10px;
border-left:3px solid gold;
font-size:14px;
}

/* STATUS */

.status{
margin-top:15px;
background:#082019;
padding:12px;
border-radius:10px;
text-align:center;
color:lightgreen;
font-weight:bold;
}

/* EMPTY */

.empty{
text-align:center;
font-size:28px;
color:gold;
margin-top:80px;
}

/* RESPONSIVE */

@media(max-width:768px){

.title{
font-size:32px;
}

body{
padding:30px 5%;
}

}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">

<h1 class="title">
🏏 REGISTERED TEAMS
</h1>

<a href="index.html" class="back-btn">
← Back Home
</a>

</div>

<!-- TEAMS CONTAINER -->

<div class="teams-container" id="teamsContainer"></div>

<script>

/* LOAD TEAMS */

function loadTeams(){

let container =
document.getElementById("teamsContainer")

/* GET LOCAL STORAGE */

let teams = []

try{

teams =
JSON.parse(localStorage.getItem("teams")) || []

}catch(error){

teams = []

}

/* EMPTY */

if(!Array.isArray(teams) || teams.length === 0){

container.innerHTML = `
<div class="empty">
No Teams Registered Yet
</div>
`

return

}

/* CLEAR */

container.innerHTML = ""

/* LOOP */

teams.forEach(team => {

let playersHTML = ""

/* PLAYERS */

if(Array.isArray(team.players)){

team.players.forEach((player,index)=>{

if(player && player.trim() !== ""){

playersHTML += `

<div class="player">

🏏 Player ${index+1}: ${player}

</div>

`

}

})

}

/* IF NO PLAYERS */

if(playersHTML === ""){

playersHTML = `

<div class="player">

No Players Added

</div>

`

}

/* CARD */

container.innerHTML += `

<div class="team-card">

<img
class="team-logo"
src="${team.logo || 'https://cdn-icons-png.flaticon.com/512/857/857455.png'}">

<div class="team-name">

${team.teamName || "Unknown Team"}

</div>

<div class="row">
<span>Captain</span>
<span>${team.captain || "Not Set"}</span>
</div>

<div class="row">
<span>Vice Captain</span>
<span>${team.viceCaptain || "Not Set"}</span>
</div>

<div class="row">
<span>📱 Contact</span>
<span>${team.contact || "Not Set"}</span>
</div>

<div class="row">
<span>Total Players</span>
<span>
${team.players?.filter(p => p && p.trim() !== "").length || 0}
</span>
</div>

<div class="squad-title">

🏏 Full Squad

</div>

${playersHTML}

<div class="status">

✔ Registered Successfully

</div>

</div>

`

})

}

/* LOAD PAGE */

loadTeams()

/* AUTO UPDATE */

window.addEventListener("storage", function(){

loadTeams()

})

</script>

</body>

</html>
