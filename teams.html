<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Teams | Super Sixes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --turf-dark:#0A1B13;
  --turf-panel:#102A1D;
  --turf-panel-2:#0D2318;
  --cream:#F1EAD8;
  --cream-dim:#B9AF98;
  --ball-red:#C0392B;
  --gold:#D9A441;
  --run-green:#7FB37A;
  --hairline:rgba(241,234,216,.14);
  --hairline-strong:rgba(241,234,216,.26);
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Work Sans',sans-serif;
  --font-mono:'Space Mono',monospace;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-body)}
body{background:var(--turf-dark);color:var(--cream);padding:50px 6% 80px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.top-bar{
  display:flex;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;gap:20px;margin-bottom:30px;padding-bottom:22px;
  border-bottom:1px solid var(--hairline-strong)
}
.title{font-family:var(--font-display);font-size:clamp(32px,5vw,46px);letter-spacing:.5px;line-height:1}
.title span{color:var(--ball-red)}
.count{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--cream-dim);margin-top:8px}
.count b{color:var(--gold);font-weight:400}

.back-btn{
  border:1px solid var(--hairline-strong);color:var(--cream);padding:12px 22px;
  border-radius:3px;text-decoration:none;font-weight:600;font-size:14px;transition:.25s
}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

.search-row{margin-bottom:20px}
.search-row input{
  width:100%;max-width:360px;padding:12px 14px;border-radius:3px;
  background:var(--turf-panel-2);color:var(--cream);
  border:1px solid var(--hairline-strong);font-size:14px
}
.search-row input::placeholder{color:var(--cream-dim);opacity:.7}
.search-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.18)}

.refresh-note{font-size:12px;color:var(--cream-dim);margin-bottom:25px}
.teams-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px}

.team-card{
  min-width:0;background:var(--turf-panel);border-left:3px solid var(--ball-red);
  padding:26px 26px 22px;animation:fadeUp .5s ease forwards;
  transition:border-color .25s,transform .25s
}
.team-card:hover{transform:translateY(-4px);outline:1px solid var(--hairline-strong)}

.team-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.team-logo{
  width:64px;height:64px;border-radius:50%;object-fit:cover;
  border:2px solid var(--hairline-strong);background:var(--cream);flex-shrink:0
}
.team-name{font-family:var(--font-display);font-size:24px;letter-spacing:.3px;line-height:1.15;overflow-wrap:anywhere}

.row{
  display:flex;justify-content:space-between;gap:15px;padding:9px 0;
  border-bottom:1px solid var(--hairline);font-size:14px;color:var(--cream-dim)
}
.row span:last-child{color:var(--cream);font-weight:500;text-align:right;overflow-wrap:anywhere}

.squad-title{margin-top:20px;margin-bottom:10px;color:var(--gold);font-family:var(--font-mono);font-size:12px;letter-spacing:1.5px}
.squad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:6px}
.player{
  min-width:0;background:var(--turf-panel-2);padding:9px 11px;border-radius:2px;
  font-size:13px;color:var(--cream-dim);display:flex;gap:8px;align-items:baseline
}
.player .num{font-family:var(--font-mono);color:var(--gold);flex-shrink:0;font-size:11px}
.player .player-name{overflow-wrap:anywhere;word-break:break-word}

.status{
  margin-top:16px;padding:10px;text-align:center;font-size:13px;font-weight:600;
  letter-spacing:.5px;color:var(--run-green);border:1px solid rgba(127,179,122,.3);
  background:rgba(127,179,122,.08)
}
.message{
  grid-column:1/-1;text-align:center;padding:45px 20px;
  border:1px dashed var(--hairline-strong);color:var(--cream-dim);line-height:1.8
}
.message h2{font-family:var(--font-display);font-size:28px;color:var(--cream);font-weight:400;margin-bottom:10px}
.message a{display:inline-block;margin-top:16px;background:var(--ball-red);color:var(--cream);padding:12px 26px;border-radius:3px;text-decoration:none;font-weight:600}
.no-results{text-align:center;grid-column:1/-1;color:var(--cream-dim);font-family:var(--font-mono);font-size:13px;padding:60px 0}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.team-card{animation:none}}
@media(max-width:768px){body{padding:36px 5% 60px}.team-card{padding:22px 18px}}

</style>

</head>

<body>
<div class="top-bar">
  <div>
    <h1 class="title">Registered <span>Teams</span></h1>
    <div class="count" id="teamCount">Loading teams...</div>
  </div>
  <a href="index.html" class="back-btn">&larr; Back Home</a>
</div>

<div class="search-row">
  <input id="searchInput" type="search" placeholder="Search by team or captain..." aria-label="Search teams">
</div>

<div class="refresh-note" id="refreshNote">Loading registrations from the tournament database...</div>
<div class="teams-container" id="teamsContainer" aria-live="polite"></div>

<script>
const SUPABASE_URL = "https://slkqiklzpoaalrvjfdew.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xVobjT2a_3S3N__5gsR65Q_M1FBFpcu";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let allTeams = [];

const container = document.getElementById("teamsContainer");
const countEl = document.getElementById("teamCount");
const noteEl = document.getElementById("refreshNote");
const searchInput = document.getElementById("searchInput");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function normalizeSquad(value) {
  if (Array.isArray(value)) {
    return value
      .map(player => typeof player === "string" ? player : player?.name || "")
      .map(player => player.trim())
      .filter(Boolean);
  }

  if (typeof value === "string" && value.trim()) {
    try {
      return normalizeSquad(JSON.parse(value));
    } catch {
      return value.split(/\r?\n|,/).map(player => player.trim()).filter(Boolean);
    }
  }

  return [];
}

function normalizeTeam(row) {
  return {
    id: row.id,
    teamName: row.team_name || "Unknown Team",
    captain: row.captain_name || "Not Set",
    viceCaptain: row.vice_captain || "Not Set",
    contact: row.phone || "Not Set",
    players: normalizeSquad(row.squad),
    createdAt: row.created_at
  };
}
  
function renderTeams() {
  const query = searchInput.value.trim().toLowerCase();

  const filtered = allTeams.filter(team =>
    team.teamName.toLowerCase().includes(query) ||
    team.captain.toLowerCase().includes(query)
  );

  countEl.innerHTML = `<b>${allTeams.length}</b> team${allTeams.length === 1 ? "" : "s"} registered`;

  if (allTeams.length === 0) {
    container.innerHTML = `
      <div class="message">
        <h2>No Teams Registered Yet</h2>
        <p>Be the first squad to lock in its spot in the draw.</p>
        <a href="register.html">Register Your Team</a>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results">No teams match your search</div>`;
    return;
  }

  container.innerHTML = filtered.map((team, index) => {
    const playersHTML = team.players.length
      ? team.players.map((player, playerIndex) => `
          <div class="player">
            <span class="num">${String(playerIndex + 1).padStart(2, "0")}</span>
            <span class="player-name">${escapeHTML(player)}</span>
          </div>`).join("")
      : `<div class="player">No players added</div>`;

    return `
      <article class="team-card" style="animation-delay:${Math.min(index, 8) * .06}s">
        <div class="team-head">
          <div class="team-logo" aria-hidden="true" style="display:grid;place-items:center;font-size:25px">🏏</div>
          <div class="team-name">${escapeHTML(team.teamName)}</div>
        </div>

        <div class="row"><span>Captain</span><span>${escapeHTML(team.captain)}</span></div>
        <div class="row"><span>Vice Captain</span><span>${escapeHTML(team.viceCaptain)}</span></div>
        <div class="row"><span>Contact</span><span>${escapeHTML(team.contact)}</span></div>
        <div class="row"><span>Total Players</span><span>${team.players.length}</span></div>
        
        <div class="squad-title">FULL SQUAD</div>
        <div class="squad-grid">${playersHTML}</div>
        <div class="status">Registered Successfully</div>
      </article>`;
  }).join("");
}

async function loadTeams() {
  noteEl.textContent = "Loading registrations from the tournament database...";

  const { data, error } = await supabaseClient
    .from("public_registered_teams")
    .select("id, team_name, captain_name, vice_captain, squad, phone, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Unable to load registered teams:", error);
    countEl.textContent = "Unable to load teams";
    noteEl.textContent = "The database could not return the public team list. Please check the view permissions and Supabase settings.";
    container.innerHTML = `
      <div class="message">
        <h2>Teams Could Not Be Loaded</h2>
        <p>Please try again shortly. If the problem continues, the database permissions need checking.</p>
        <button id="retryButton" type="button" style="margin-top:16px;padding:12px 24px;background:#C0392B;color:#F1EAD8;border:0;cursor:pointer">Try Again</button>
      </div>`;
    document.getElementById("retryButton").addEventListener("click", loadTeams);
    return;
  }

  allTeams = (data || []).map(normalizeTeam);
  noteEl.textContent = "Live team list from Supabase. Refresh the page to check for new registrations.";
  renderTeams();
}

searchInput.addEventListener("input", renderTeams);

loadTeams();

// Refresh periodically so new registrations appear without manually reloading.
setInterval(loadTeams, 30000);
</script>

</body>
</html>
